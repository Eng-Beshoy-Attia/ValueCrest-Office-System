*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
img{max-width:100%}
.hidden{display:none!important}
#root{min-height:100%}

/* ---------- Splash & login ---------- */
.splash{position:fixed;inset:0;background:#101823;display:grid;place-items:center;z-index:100}
.splash img{width:120px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.login{min-height:100vh;min-height:100dvh;background:#101823;color:var(--on-navy);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) 22px calc(24px + env(safe-area-inset-bottom,0px))}
.login .logo{width:min(320px,80vw);margin-bottom:8px}
.login form{width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px;margin-top:10px}
.login h1{font-family:var(--serif);font-weight:600;font-size:28px;margin:0;text-align:center}
.login p.sub{margin:0 0 6px;text-align:center;color:var(--on-navy-muted);font-size:14px}
.lf label{display:block;font-size:13px;font-weight:700;color:var(--on-navy-muted);margin-bottom:6px}
.lf input{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(194,154,82,.35);border-radius:12px;padding:14px 14px;font-size:16px;color:#F3EFE6}
.lf input:focus{outline:none;border-color:#D3AE69;background:rgba(255,255,255,.09)}
.pw{position:relative}
.pw button{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--on-navy-muted);font-size:13px;font-weight:700;padding:8px}
.chk{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--on-navy-muted)}
.chk input{width:20px;height:20px;accent-color:#D3AE69}
.login .err{background:rgba(242,154,170,.12);border:1px solid rgba(242,154,170,.4);color:#F6B7C2;border-radius:10px;padding:10px 12px;font-size:13.5px}
.login .info{background:rgba(211,174,105,.12);border:1px solid rgba(211,174,105,.4);color:#E9CF97;border-radius:10px;padding:10px 12px;font-size:13.5px}
.credit{margin-top:28px;text-align:center;font-size:12.5px;color:var(--on-navy-muted)}
.credit b{color:#D3AE69;font-weight:700}

/* ---------- Buttons ---------- */
.btn{border:1px solid transparent;border-radius:12px;padding:11px 18px;font-weight:700;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px;line-height:1.2;min-height:44px}
.btn-gold{background:#C29A52;color:#1d1505}
.btn-gold:active{background:#9C7633}
.btn-act{background:var(--act);color:var(--act-t)}
.btn-ghost{background:var(--surface);border-color:var(--border);color:var(--text)}
.btn-danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn-sm{padding:7px 12px;font-size:13px;min-height:36px;border-radius:10px}
.btn-block{width:100%}
.btn[disabled]{opacity:.55;cursor:progress}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .7s linear infinite;display:inline-block}
@keyframes rot{to{transform:rotate(360deg)}}

/* ---------- App shell ---------- */
.app{min-height:100%;display:flex}
.side{display:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh}
.appbar{position:sticky;top:0;z-index:20;background:var(--navy);color:var(--on-navy);padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;display:flex;align-items:center;gap:10px;min-height:calc(58px + env(safe-area-inset-top,0px))}
.appbar .back{background:none;border:0;color:var(--on-navy);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;margin-left:-6px}
.appbar .back:active{background:rgba(255,255,255,.08)}
.appbar .ttl{flex:1;min-width:0}
.appbar .ttl b{display:block;font-family:var(--serif);font-size:23px;font-weight:600;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .ttl small{display:block;font-size:12px;color:var(--on-navy-muted)}
.appbar .mark{width:34px;height:30px;object-fit:contain}
.sync{background:none;border:1px solid rgba(255,255,255,.14);color:var(--on-navy-muted);border-radius:10px;height:36px;padding:0 10px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px}
.sync .dot{width:7px;height:7px;border-radius:50%;background:#7FD0AB}
.sync.off .dot{background:#F29AAA}
.avatar{width:36px;height:36px;border-radius:50%;background:#C29A52;color:#1d1505;display:grid;place-items:center;font-weight:800;font-size:13px;border:0;flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.appbar .avatar{box-shadow:0 0 0 2px rgba(194,154,82,.7)}
.content{flex:1;padding:16px 16px calc(var(--tab-h) + 30px + env(safe-area-inset-bottom,0px));max-width:1100px;width:100%;margin:0 auto}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));height:calc(var(--tab-h) + env(safe-area-inset-bottom,0px))}
.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:700;border-radius:12px}
.tabs a svg{width:23px;height:23px}
.tabs a.on{color:var(--gold-strong)}
.tabs a.on svg{stroke:var(--gold-strong)}
.fab{position:fixed;right:18px;bottom:calc(var(--tab-h) + 18px + env(safe-area-inset-bottom,0px));z-index:24;width:58px;height:58px;border-radius:18px;background:#C29A52;color:#1d1505;border:0;box-shadow:0 10px 24px rgba(0,0,0,.25);display:grid;place-items:center}
.fab svg{width:26px;height:26px}

@media (min-width:900px){
  .side{display:flex;flex-direction:column;width:250px;flex:none;background:var(--navy);color:var(--on-navy);position:sticky;top:0;height:100vh;padding:22px 14px}
  .side .brand{display:flex;flex-direction:column;align-items:center;padding:6px 0 22px;border-bottom:1px solid rgba(194,154,82,.25);margin-bottom:14px}
  .side .brand img{width:180px}
  .side a{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;color:var(--on-navy-muted);text-decoration:none;font-weight:700;font-size:14px}
  .side a svg{width:20px;height:20px}
  .side a:hover{color:var(--on-navy);background:rgba(255,255,255,.05)}
  .side a.on{background:#C29A52;color:#1d1505}
  .side a.on svg{stroke:#1d1505}
  .side .foot{margin-top:auto;font-size:11.5px;color:var(--on-navy-muted);padding:12px 14px;border-top:1px solid rgba(194,154,82,.25)}
  .side .foot b{color:#D3AE69}
  .tabs{display:none}
  .appbar{padding:14px 28px}
  .appbar .mark{display:none}
  .content{padding:24px 28px 60px}
  .fab{bottom:28px;right:28px}
}

/* ---------- Generic blocks ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 4px;flex-wrap:wrap}
.card-h h3{margin:0;font-size:16px;font-weight:800}
.card-b{padding:4px 16px 14px}
.sec{margin-top:22px}
.sec-t{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:0 2px 10px;flex-wrap:wrap}
.sec-t h2{margin:0;font-family:var(--serif);font-size:26px;font-weight:600;line-height:1.1}
.sec-t .sub{color:var(--muted);font-size:13px}
.empty{color:var(--muted);font-size:14px;padding:16px 2px;text-align:center}
.empty b{color:var(--text)}
.row{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.row:last-child{border-bottom:0}
.row .m{flex:1;min-width:0}
.row .t{font-weight:700;overflow:hidden;text-overflow:ellipsis}
.row .s{color:var(--muted);font-size:12.5px}
.row .chev{color:var(--faint);flex:none}
a.row:active{background:var(--surface-2)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;padding:3px 10px;border-radius:999px;white-space:nowrap}
.st-done{background:var(--ok-bg);color:var(--ok)} .st-run{background:var(--run-bg);color:var(--run)} .st-idle{background:var(--idle-bg);color:var(--idle)}
.st-late{background:var(--bad-bg);color:var(--bad)} .st-hold{background:var(--hold-bg);color:var(--hold)} .st-warn{background:var(--warn-bg);color:var(--warn)}
.co-tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted)}
.co-tag i{width:8px;height:8px;border-radius:50%;background:var(--c);display:inline-block}
.bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:99px}
.bar.done i{background:var(--ok)}
.up{color:var(--ok)} .flat{color:var(--faint)} .down{color:var(--bad)}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;padding:7px 13px;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--act);color:var(--act-t)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;margin:0 -2px}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:700;font-size:13px;white-space:nowrap;color:var(--muted)}
.chip.on{background:var(--act);color:var(--act-t);border-color:transparent}

/* ---------- Home ---------- */
.hello{background:#101823;color:#F3EFE6;border-radius:22px;padding:20px;display:grid;grid-template-columns:1fr;gap:16px;overflow:hidden}
.hello .top{display:flex;gap:16px;align-items:center}
.hello .top img{width:88px;flex:none}
.hello h1{margin:0;font-family:var(--serif);font-weight:600;font-size:26px;line-height:1.1}
@media (min-width:700px){.hello h1{font-size:34px}.hello .top img{width:110px}}
.hello p{margin:4px 0 0;color:#A7AFBF;font-size:13.5px}
.doors{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.door{background:rgba(255,255,255,.05);border:1px solid rgba(194,154,82,.35);border-radius:16px;padding:14px;color:#F3EFE6;text-decoration:none;display:flex;flex-direction:column;gap:4px;min-height:112px}
.door:active{background:rgba(194,154,82,.12)}
.door svg{width:26px;height:26px;stroke:#D3AE69}
.door .t{font-family:var(--serif);font-size:21px;font-weight:600;line-height:1.1;margin-top:4px}
.door .k{color:#D3AE69;font-weight:700;font-size:12.5px;margin-top:auto}
.cos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.co{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.co::before{content:"";position:absolute;left:0;top:0;right:0;height:3px;background:var(--c);display:none}
.co .h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.logo-tile{display:flex;align-items:center;justify-content:center;border-radius:12px;padding:6px 10px;height:62px;flex:1;min-width:0;border:1px solid rgba(0,0,0,.06)}
.logo-tile img{max-height:100%;max-width:100%;object-fit:contain;display:block}
.co-banner{height:120px;border-radius:18px;margin-bottom:14px;padding:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (min-width:700px){.logo-tile{height:74px}.co-banner{height:150px}}
.co h3{margin:0;font-family:var(--serif);font-size:20px;font-weight:700;line-height:1.05;min-width:0;overflow-wrap:anywhere}
@media (min-width:700px){.co h3{font-size:24px}}
.co .meta{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.co .meta .bad{color:var(--bad);font-weight:700}
.co .d{font-size:12px;font-weight:700}
.ring{width:44px;height:44px;flex:none}
.today-item{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.today-item:last-child{border-bottom:0}
.today-item .tm{font-weight:800;min-width:72px}
.chair-note{background:var(--gold-soft);border-radius:14px;padding:12px 14px;margin-bottom:8px;display:block;text-decoration:none;color:inherit}
.chair-note .x{white-space:pre-wrap;font-weight:600}
.chair-note .s{font-size:12px;color:var(--gold-ink);margin-top:4px}

/* ---------- Company / project ---------- */
.co-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px}
.kpi .n{font-family:var(--serif);font-size:30px;font-weight:700;line-height:1}
.kpi .l{font-size:12px;color:var(--muted);margin-top:4px}
.kpi.bad .n{color:var(--bad)} .kpi.ok .n{color:var(--ok)} .kpi.gold .n{color:var(--gold-strong)}
.chart{width:100%;height:auto;display:block;max-height:280px}
.chart text{font-family:var(--sans);font-size:11px;fill:var(--muted)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .lineP{fill:none;stroke:var(--gold);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--gold);opacity:.13}
.chart .dot{fill:var(--surface);stroke:var(--gold);stroke-width:2}
.chart .val{fill:var(--text);font-weight:800;font-size:12px}
.pcard{display:block;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;text-decoration:none;color:inherit;margin-bottom:10px;box-shadow:var(--shadow)}
.pcard:active{background:var(--surface-2)}
.pcard .t{font-weight:800;font-size:15.5px}
.pcard .s{color:var(--muted);font-size:12.5px;margin-top:2px}
.pcard .p{display:flex;align-items:center;gap:10px;margin-top:10px}
.pcard .p .bar{flex:1}
.pcard .p b{font-size:13px;min-width:38px;text-align:right}
.pcard .f{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px;font-size:12px}
.big{display:flex;align-items:center;gap:14px}
.big .n{font-family:var(--serif);font-size:48px;font-weight:700;line-height:1}
.big .bar{flex:1;height:10px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin-top:14px}
.facts span{display:block;font-size:12px;color:var(--muted)}
.facts b{font-size:14px}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:grid;grid-template-columns:70px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.hist li:last-child{border-bottom:0}
.hist .p{font-weight:800;font-size:15px}
.hist .d{color:var(--muted);font-size:12px}

/* ---------- Schedule ---------- */
.week-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.week-bar .rng{font-family:var(--serif);font-size:22px;font-weight:700;text-align:center;flex:1}
.icon-b{width:42px;height:42px;border-radius:12px;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;flex:none}
.days{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:14px}
.dchip{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:8px 2px;text-align:center;font-size:11px;color:var(--muted);font-weight:700;position:relative}
.dchip b{display:block;font-size:18px;color:var(--text);font-weight:800;margin-top:2px}
.dchip.on{background:var(--act);border-color:transparent;color:var(--act-t)}
.dchip.on b{color:var(--act-t)}
.dchip .cnt{position:absolute;top:4px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--gold)}
.dchip.today:not(.on){border-color:var(--gold)}
.appt{display:flex;gap:14px;padding:14px;background:var(--surface);border:1px solid var(--border);border-radius:16px;margin-bottom:10px;text-decoration:none;color:inherit;box-shadow:var(--shadow)}
.appt .tm{min-width:70px;font-weight:800}
.appt .tm small{display:block;font-weight:600;color:var(--muted);font-size:12px}
.appt .m{flex:1;min-width:0}
.appt .who{font-weight:800}
.appt .s{color:var(--muted);font-size:12.5px}
.appt .side-r{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.mgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:6px}
.mh{text-align:center;font-size:11.5px;font-weight:800;color:var(--muted);padding-bottom:2px}
.mc{background:var(--surface);border:1px solid var(--border);border-radius:12px;min-height:60px;padding:6px 7px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;font:inherit;color:inherit;text-align:left}
.mc b{font-size:15px;font-weight:800}
.mc.out{opacity:.38}
.mc.today{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.mc .n{font-size:11px;font-weight:800;background:var(--gold-soft);color:var(--gold-ink);border-radius:99px;padding:1px 7px}
@media (min-width:700px){.mc{min-height:84px}}
.day-empty{color:var(--faint);font-size:13px;padding:2px 2px 8px}
.day-lbl{font-weight:800;font-size:13px;color:var(--muted);margin:16px 2px 8px;display:flex;justify-content:space-between}

/* ---------- Initiatives ---------- */
.ini{display:flex;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:10px;text-decoration:none;color:inherit;box-shadow:var(--shadow)}
.ini .pr{width:5px;border-radius:4px;flex:none}
.pr-High{background:var(--bad)} .pr-Medium{background:var(--gold)} .pr-Low{background:var(--faint)}
.ini .m{flex:1;min-width:0}
.ini .t{font-weight:800}
.ini p{margin:4px 0 6px;color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ini .meta{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}

/* ---------- Comments ---------- */
.cmts{list-style:none;margin:0;padding:0}
.cmt{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.cmt:last-child{border-bottom:0}
.cmt .av{width:32px;height:32px;font-size:11.5px}
.cmt .h{font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cmt .h b{color:var(--text)}
.cmt .x{white-space:pre-wrap;font-size:14.5px;margin-top:2px}
.cmt.chair{background:var(--gold-soft);border-radius:14px;padding:11px;border-bottom:0;margin:4px 0}
.ctag{font-size:10.5px;font-weight:800;background:#C29A52;color:#1d1505;border-radius:99px;padding:2px 8px}
.cform{display:flex;gap:8px;margin-top:10px;align-items:flex-end}
.cform textarea{flex:1;background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:11px 12px;min-height:46px;max-height:160px;resize:none;font-size:15px}
.cform textarea:focus{outline:none;border-color:var(--gold)}
.linkb{text-decoration:none;background:none;border:0;padding:0;font-weight:700;font-size:12.5px;color:var(--gold-strong)}
.linkb.danger{color:var(--bad)}

/* ---------- Sheets (forms) ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:60;display:none}
.sheet-wrap.open{display:block}
.sheet-bg{position:absolute;inset:0;background:rgba(8,13,20,.55);animation:fade .18s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;background:var(--surface);border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:up .22s ease;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet .grab{width:42px;height:5px;border-radius:9px;background:var(--border);margin:8px auto 2px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:6px 18px 10px;border-bottom:1px solid var(--line)}
.sheet-h h3{margin:0;font-family:var(--serif);font-size:24px;font-weight:600}
.sheet-b{overflow-y:auto;padding:14px 18px 18px;-webkit-overflow-scrolling:touch}
.sheet-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:10px}
.sheet-f .btn{flex:1}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
@media (min-width:700px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:540px;border-radius:20px;max-height:88%;animation:fade .18s}
  .sheet .grab{display:none}
}
.f{margin-bottom:14px}
.f label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px}
.f input,.f select,.f textarea{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:12px;font-size:16px;min-height:46px}
.f textarea{min-height:90px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--gold)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input[type=range]{accent-color:#C29A52;padding:0!important;min-height:30px!important;background:none!important;border:0!important}
.rng-v{font-family:var(--serif);font-size:34px;font-weight:700;color:var(--gold-strong)}
.note{font-size:13px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:20px;font-weight:700;letter-spacing:.04em;background:var(--gold-soft);color:var(--gold-ink);border-radius:12px;padding:14px;text-align:center;margin:10px 0;user-select:all}
.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + 22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#101823;color:#F3EFE6;padding:11px 18px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:all .2s;z-index:90;border:1px solid rgba(194,154,82,.5);max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{border-color:#F29AAA}
@media (min-width:900px){.toast{bottom:28px}}
.offline{background:var(--warn-bg);color:var(--warn);font-size:13px;font-weight:700;text-align:center;padding:8px}
.prof{display:flex;gap:14px;align-items:center}
.prof .avatar{width:72px;height:72px;font-size:22px;box-shadow:0 0 0 3px var(--gold-soft)}
.prof b{font-size:17px}
.menu a,.menu button{display:flex;width:100%;align-items:center;gap:12px;padding:15px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-decoration:none;color:inherit;font-weight:700;text-align:left}
.menu > :last-child{border-bottom:0}
.menu .chev{margin-left:auto;color:var(--faint)}
@media (min-width:700px){ .kpis{grid-template-columns:repeat(6,1fr)} .cos{grid-template-columns:repeat(3,1fr)} .two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px} .two .sec{margin-top:0} }
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* ---------- utils ---------- */
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const isoDay = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseDay = s => { const [y,m,d]=String(s).split("-").map(Number); return new Date(y,(m||1)-1,d||1); };
const todayStr = () => isoDay(new Date());
const endOfDay = d => { const x=new Date(d); x.setHours(23,59,59,999); return x.getTime(); };
const ms = s => s ? new Date(s).getTime() : 0;
const fmtDate = s => s ? parseDay(s).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}) : "—";
const fmtShort = d => d.toLocaleDateString("en-GB",{day:"numeric",month:"short"});
const fmtTime = t => { if(!t) return ""; let [h,m]=t.split(":").map(Number); const ap=h>=12?"PM":"AM"; h=h%12||12; return h+":"+pad(m)+" "+ap; };
const ago = iso => { const s=(Date.now()-ms(iso))/1000; if(s<60) return "just now"; if(s<3600) return Math.floor(s/60)+" min ago"; if(s<86400) return Math.floor(s/3600)+" h ago"; if(s<604800) return Math.floor(s/86400)+" d ago"; return new Date(iso).toLocaleDateString("en-GB",{day:"numeric",month:"short"}); };
const logoTile = (k, cls="") => LOGOS[k] ? `<div class="logo-tile ${cls}" style="background:${LOGOS[k][1]}"><img src="${LOGOS[k][0]}" alt="${esc(coOf(k).name)} logo"></div>` : "";
const coOf = k => COMPANIES.find(c=>c.key===k) || (k==="group"?GROUP:{key:k,name:k||"—",c:"#999"});
const daysLeft = s => s ? Math.round((parseDay(s)-parseDay(todayStr()))/86400000) : null;
const initials = n => String(n||"?").replace(/\(.*?\)/g,"").trim().replace(/^(Dr|Eng|Ms|Mr|Mrs)\.?\s+/i,"").split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();

/* ---------- API ---------- */
const inAppsScript = () => !!(window.google && google.script && google.script.run);
function apiUrl(){ const u=window.VC_API_URL; if(u && u.indexOf("http")===0) return u; return store.get("vc_api")||""; }
function rawCall(action, data){
  const payload = JSON.stringify({action, token:S.token, data:data||{}});
  if(window.google && google.script && google.script.run){
    return new Promise((res,rej)=>google.script.run.withSuccessHandler(r=>{ try{ res(JSON.parse(r)); }catch(e){ rej(e); } }).withFailureHandler(rej).api(payload));
  }
  const url = apiUrl();
  if(!url || url.indexOf("http")!==0) return Promise.reject({setup:true});
  return fetch(url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:payload,redirect:"follow"}).then(r=>r.json());
}
async function call(action, data, opts={}){
  let r;
  try{ r = await rawCall(action, data); S.online=true; }
  catch(e){
    S.online=false; renderStatus();
    if(e && e.setup){ if(!opts.quiet) toast("The app isn’t connected yet. Add the Web App URL in the file’s settings.", true); }
    else if(!opts.quiet) toast("No connection. Check your internet and try again.", true);
    return null;
  }
  if(!r.ok){
    if(r.error==="AUTH"){ signOutLocal(r.message); return null; }
    if(r.error==="MUST_CHANGE"){ S.user = Object.assign(S.user||{name:""},{mustChange:true}); renderApp(); return null; }
    if(!opts.quiet) toast(r.message||"Something went wrong.", true);
    return null;
  }
  if(r.projects){ applyData(r); }
  return r;
}
function applyData(r){
  S.data = {users:r.users||[], projects:r.projects||[], updates:r.updates||[], appointments:r.appointments||[], initiatives:r.initiatives||[], comments:r.comments||[]};
  S.data.projects.forEach(p=>p.progress=Number(p.progress)||0);
  S.data.updates.forEach(u=>u.progress=Number(u.progress)||0);
  if(r.user) S.user = r.user;
  S.lastSync = Date.now();
  store.set("vc_cache", JSON.stringify({data:S.data, user:S.user, at:S.lastSync}));
}
async function sync(quiet){
  if(!S.token || S.syncing) return;
  S.syncing=true; renderStatus();
  const r = await call("bootstrap", {}, {quiet:true});
  S.syncing=false;
  if(r){ renderView(); } else if(!quiet && !S.online) toast("You’re offline. Showing the last saved data.", true);
  renderStatus();
}
function signOutLocal(msg){
  S.token=null; S.user=null; S.data=null;
  store.del("vc_token"); store.del("vc_cache");
  closeSheet(true);
  renderLogin(msg ? {info:msg} : {});
}

/* ---------- routing ---------- */
function parseRoute(){ const h=(location.hash||"").replace(/^#\/?/,""); const [a,b]=h.split("/"); return {name:a||"home", id:b?decodeURIComponent(b):null}; }
const TAB_OF = {home:"home",schedule:"schedule",appt:"schedule",companies:"companies",company:"companies",project:"companies",initiatives:"initiatives",initiative:"initiatives",profile:"profile",users:"profile",password:"profile"};
const PARENT = r => ({company:"#/companies", project: (()=>{ const p=D().projects.find(x=>x.id===r.id); return p?"#/company/"+p.company:"#/companies"; })(), appt:"#/schedule", initiative:"#/initiatives", users:"#/profile", password:"#/profile"})[r.name];
let ignorePop = false;
function onRoute(){ store.set("vc_route", location.hash); renderView(); window.scrollTo(0,0); }
function go(hash){
  if(location.hash===hash){ renderView(); return; }
  const d=(history.state&&history.state.vc)||0;
  try{ history.pushState({vc:d+1},"",hash); onRoute(); }catch(e){ location.hash=hash; }
}
function back(){ if(history.state && history.state.vc>0) history.back(); else location.replace(PARENT(parseRoute())||"#/home"); }
window.addEventListener("popstate", ()=>{ if(ignorePop){ ignorePop=false; return; } if(sheetOpen){ closeSheet(true); return; } onRoute(); });
window.addEventListener("hashchange", ()=>{ if(sheetOpen) closeSheet(true); const r=parseRoute(); if(r.name+"/"+(r.id||"")!==S._lastRoute) onRoute(); });
document.addEventListener("click", e=>{ const a=e.target.closest("a[href^='#/']"); if(a && !e.defaultPrevented && !e.metaKey && !e.ctrlKey){ e.preventDefault(); go(a.getAttribute("href")); } });

/* ---------- progress math ---------- */
const updatesFor = pid => D().updates.filter(u=>u.projectId===pid).sort((a,b)=>ms(a.at)-ms(b.at));
function valueAt(p,endMs,ups){
  ups = ups||updatesFor(p.id);
  if(ms(p.createdAt)>endMs && (!ups.length || ms(ups[0].at)>endMs)) return null;
  let v=null; for(const u of ups){ if(ms(u.at)<=endMs) v=u.progress; else break; }
  if(v===null) v = ups.length?0:p.progress;
  return v;
}
function buckets(){
  const now=new Date(), out=[];
  if(S.period==="daily"){ for(let i=13;i>=0;i--){ const d=new Date(now); d.setDate(d.getDate()-i); out.push({end:endOfDay(d),label:fmtShort(d)}); } }
  else if(S.period==="weekly"){ for(let i=11;i>=0;i--){ const d=new Date(now); d.setDate(d.getDate()-7*i); out.push({end:endOfDay(d),label:fmtShort(d)}); } }
  else { for(let i=5;i>=0;i--){ const d=i===0?new Date(now):new Date(now.getFullYear(),now.getMonth()-i+1,0); out.push({end:endOfDay(d),label:d.toLocaleDateString("en-GB",{month:"short"})}); } }
  return out;
}
function deltaFor(p){ const ups=updatesFor(p.id); const n=valueAt(p,Date.now(),ups); const st=new Date(); st.setDate(st.getDate()-PERIOD[S.period].days); const b=valueAt(p,endOfDay(st),ups); return n===null?0:n-(b===null?0:b); }
const avg = a => a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0;
function companySeries(k){ const ps=D().projects.filter(p=>p.company===k); return buckets().map(b=>{ const v=ps.map(p=>valueAt(p,b.end)).filter(x=>x!==null); return {label:b.label, v:v.length?avg(v):null}; }); }
function projectSeries(p){ const ups=updatesFor(p.id); return buckets().map(b=>({label:b.label, v:valueAt(p,b.end,ups)})); }
function timing(p){
  if(p.status==="Completed") return {txt:"Completed",cls:"st-done",key:"done"};
  const d=daysLeft(p.deadline);
  if(d===null) return {txt:"No deadline",cls:"st-idle",key:"none"};
  if(d<0) return {txt:(-d)+(d===-1?" day":" days")+" overdue",cls:"st-late",key:"overdue"};
  if(d===0) return {txt:"Due today",cls:"st-warn",key:"soon"};
  if(d<=7) return {txt:"Due in "+d+(d===1?" day":" days"),cls:"st-warn",key:"soon"};
  return {txt:d+" days left",cls:"st-idle",key:"ok"};
}
const stClass = st => ({"Completed":"st-done","Done":"st-done","In Progress":"st-run","Approved":"st-run","Not Started":"st-idle","Proposed":"st-idle","Delayed":"st-late","On Hold":"st-hold","Parked":"st-hold"})[st]||"st-idle";
const deltaHtml = d => d>0?`<span class="up">▲ ${d}%</span>`:d<0?`<span class="down">▼ ${-d}%</span>`:`<span class="flat">No change</span>`;
function setPeriod(k){ S.period=k; store.set("vc_period",k); renderView(); }
const periodSeg = () => `<div class="seg" role="group" aria-label="Progress period">${Object.entries(PERIOD).map(([k,v])=>`<button class="${S.period===k?"on":""}" onclick="setPeriod('${k}')">${v.name}</button>`).join("")}</div>`;

/* ---------- svg ---------- */
function lineChart(series,h=200){
  const narrow = window.innerWidth<600; if(narrow) h=Math.round(h*0.85);
  const W=narrow?380:(window.innerWidth>1100?920:640),H=h,L=36,R=16,T=20,B=28,n=series.length,step=(W-L-R)/Math.max(1,n-1),y=v=>T+(H-T-B)*(1-v/100);
  let g=""; [0,50,100].forEach(v=>{ g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${v}%</text>`; });
  const pts=series.map((s,i)=>s.v===null?null:[L+i*step,y(s.v),s.v]);
  let d="",first=null,last=null; pts.forEach(p=>{ if(!p) return; d+=(first?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)+" "; if(!first) first=p; last=p; });
  const area = first?d+`L${last[0].toFixed(1)} ${y(0)} L${first[0].toFixed(1)} ${y(0)} Z`:"";
  const every=Math.ceil(n/6);
  const labels=series.map((s,i)=>((i%every===0 && n-1-i>=Math.ceil(every/2))||i===n-1)?`<text x="${L+i*step}" y="${H-8}" text-anchor="middle">${esc(s.label)}</text>`:"").join("");
  const dots=pts.map((p,i)=>p?`<circle class="dot" cx="${p[0]}" cy="${p[1]}" r="${i===n-1?5:3}"/>`:"").join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Progress over time">${g}${first?`<path class="area" d="${area}"/><path class="lineP" d="${d}"/>`:""}${dots}${last?`<text class="val" x="${Math.min(last[0],W-R-4)}" y="${last[1]-11}" text-anchor="end">${last[2]}%</text>`:""}${labels}${first?"":`<text x="${W/2}" y="${H/2}" text-anchor="middle">No progress logged yet</text>`}</svg>`;
}
function ring(p,c){ const r=19,C=2*Math.PI*r; return `<svg class="ring" viewBox="0 0 48 48" aria-label="${p}%"><circle cx="24" cy="24" r="${r}" fill="none" stroke="var(--line)" stroke-width="5"/><circle cx="24" cy="24" r="${r}" fill="none" stroke="${c}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${(C*(1-p/100)).toFixed(2)}" transform="rotate(-90 24 24)"/><text x="24" y="28" text-anchor="middle" font-size="11.5" font-weight="800" fill="var(--text)" font-family="Manrope,sans-serif">${p}%</text></svg>`; }

/* ---------- pages ---------- */
/* Work week: Saturday → Thursday. Friday is the weekend. */
const isFri = d => d.getDay()===5;
function workDay(d, dir){ const x=new Date(d); while(isFri(x)) x.setDate(x.getDate()+(dir<0?-1:1)); return x; }
function weekOf(ds){
  const d=parseDay(ds); if(isFri(d)) d.setDate(d.getDate()+1);      // on Friday, show the coming week
  d.setDate(d.getDate()-((d.getDay()+1)%7));                         // back to Saturday
  const days=[]; for(let i=0;i<6;i++){ const x=new Date(d); x.setDate(d.getDate()+i); days.push(x); }
  const fri=new Date(d); fri.setDate(d.getDate()+6);
  return {days, from:isoDay(days[0]), to:isoDay(days[5]), fri:isoDay(fri), key:"w"+isoDay(days[0])};
}
const weekRange = () => weekOf(todayStr());
function schedAnchor(){ if(!S.anchor) S.anchor=isoDay(workDay(new Date())); return S.anchor; }
function setSchedView(v){ S.schedView=v; store.set("vc_sview",v); renderView(); }
function schedToday(){ S.anchor=null; renderView(); }
function openDay(ds){ S.anchor=ds; setSchedView("day"); }
function schedMove(n){
  let d=parseDay(schedAnchor());
  if(S.schedView==="day"){ d.setDate(d.getDate()+n); d=workDay(d,n); }
  else if(S.schedView==="week"){ d.setDate(d.getDate()+7*n); }
  else { d=workDay(new Date(d.getFullYear(), d.getMonth()+n, 1)); }
  S.anchor=isoDay(d); renderView();
}

function pSchedule(){
  const v=S.schedView, a=schedAnchor(), t=todayStr(), all=D().appointments;
  const sorted = l => l.slice().sort((x,y)=>(x.date+x.time).localeCompare(y.date+y.time));
  const longDay = ds => parseDay(ds).toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"short"});
  const empty = m => `<div class="card" style="margin-top:6px"><div class="empty">${m}${canWork()?" Tap <b>+</b> to add one.":""}</div></div>`;
  const strip = (wk, sel) => `<div class="days">${wk.days.map(d=>{ const ds=isoDay(d); const n=all.filter(x=>x.date===ds).length; return `<button class="dchip ${sel===ds?"on":""} ${ds===t?"today":""}" onclick="openDay('${ds}')">${d.toLocaleDateString("en-GB",{weekday:"short"})}<b>${d.getDate()}</b>${n?'<span class="cnt"></span>':""}</button>`; }).join("")}</div>`;
  let head, body, current, unit;
  if(v==="day"){
    const items=sorted(all.filter(x=>x.date===a)); const wk=weekOf(a);
    head=longDay(a); current = a===isoDay(workDay(new Date())); unit="day";
    body = strip(wk,a) + (items.length? items.map(apptCard).join("") : empty(isFri(parseDay(a))?"Friday is the weekend.":"Nothing booked on this day."));
  } else if(v==="week"){
    const wk=weekOf(a); const items=sorted(all.filter(x=>x.date>=wk.from&&x.date<=wk.fri));
    head=fmtShort(wk.days[0])+" – "+fmtShort(wk.days[5]); current = wk.from===weekRange().from; unit="week";
    const fri=items.filter(x=>x.date===wk.fri);
    body = strip(wk,null) + wk.days.map(d=>{ const ds=isoDay(d); const l=items.filter(x=>x.date===ds);
        return `<div class="day-lbl"><span>${longDay(ds)}${ds===t?" · Today":""}</span><span>${l.length||""}</span></div>${l.length?l.map(apptCard).join(""):`<div class="day-empty">No appointments</div>`}`; }).join("")
      + (fri.length?`<div class="day-lbl"><span>${longDay(wk.fri)} · Weekend</span><span>${fri.length}</span></div>${fri.map(apptCard).join("")}`:"")
      + `<div class="sec"><div class="card"><div class="card-h"><h3>Notes on this week</h3></div><div class="card-b">${commentsBlock("week",wk.key)}</div></div></div>`;
  } else {
    const d0=parseDay(a), y=d0.getFullYear(), m=d0.getMonth();
    const first=new Date(y,m,1), last=new Date(y,m+1,0);
    const start=new Date(first); start.setDate(first.getDate()-((first.getDay()+1)%7));
    const end=new Date(last); end.setDate(last.getDate()+((4-last.getDay()+7)%7));   // through Thursday
    const cells=[]; for(const x=new Date(start); x<=end; x.setDate(x.getDate()+1)){ if(!isFri(x)) cells.push(new Date(x)); }
    const from=isoDay(first), to=isoDay(last);
    const items=sorted(all.filter(x=>x.date>=from&&x.date<=to));
    head=first.toLocaleDateString("en-GB",{month:"long",year:"numeric"}); current = from===isoDay(new Date(new Date().getFullYear(),new Date().getMonth(),1)); unit="month";
    const groups={}; items.forEach(x=>{ (groups[x.date]=groups[x.date]||[]).push(x); });
    body = `<div class="mgrid">${["Sat","Sun","Mon","Tue","Wed","Thu"].map(h=>`<div class="mh">${h}</div>`).join("")}${cells.map(c=>{ const ds=isoDay(c); const n=all.filter(x=>x.date===ds).length; return `<button class="mc ${c.getMonth()!==m?"out":""} ${ds===t?"today":""}" onclick="openDay('${ds}')" aria-label="${longDay(ds)}, ${n} appointments"><b>${c.getDate()}</b>${n?`<span class="n">${n}</span>`:""}</button>`; }).join("")}</div>
      <div class="sec-t" style="margin-top:18px"><h2 style="font-size:22px">${items.length} ${items.length===1?"appointment":"appointments"} this month</h2></div>
      ${items.length? Object.keys(groups).map(ds=>`<div class="day-lbl"><span>${longDay(ds)}${ds===t?" · Today":""}</span><span>${groups[ds].length}</span></div>${groups[ds].map(apptCard).join("")}`).join("") : empty("No appointments this month.")}`;
  }
  const html = `
  <div class="seg" role="group" aria-label="Schedule view" style="display:grid;grid-template-columns:repeat(3,1fr);width:100%;margin-bottom:12px">${[["day","Daily"],["week","Weekly"],["month","Monthly"]].map(([k,l])=>`<button class="${v===k?"on":""}" onclick="setSchedView('${k}')">${l}</button>`).join("")}</div>
  <div class="week-bar"><button class="icon-b" onclick="schedMove(-1)" aria-label="Previous ${unit}">${icon("left")}</button>
    <div class="rng">${esc(head)}${current?"":`<div><button class="linkb" onclick="schedToday()">Back to ${unit==="day"?"today":"this "+unit}</button></div>`}</div>
    <button class="icon-b" onclick="schedMove(1)" aria-label="Next ${unit}">${icon("right")}</button></div>
  ${body}`;
  return {title:"Schedule", sub:"Saturday to Thursday", html, fab: canWork()?{label:"New appointment", fn:()=>editAppt()}:null};
}

const commentsFor = (t,id) => D().comments.filter(c=>c.targetType===t&&c.targetId===id).sort((a,b)=>ms(a.at)-ms(b.at));
function targetLabel(c){
  const d=D();
  if(c.targetType==="project"){ const p=d.projects.find(x=>x.id===c.targetId); return p?p.title:"a project"; }
  if(c.targetType==="initiative"){ const i=d.initiatives.find(x=>x.id===c.targetId); return i?i.title:"an initiative"; }
  if(c.targetType==="appt"){ const a=d.appointments.find(x=>x.id===c.targetId); return a?"meeting with "+a.withWho:"an appointment"; }
  if(c.targetType==="week") return "the week of "+fmtShort(parseDay(c.targetId.slice(1)));
  return "an item";
}
function targetHref(c){ return {project:"#/project/",initiative:"#/initiative/",appt:"#/appt/"}[c.targetType] ? {project:"#/project/",initiative:"#/initiative/",appt:"#/appt/"}[c.targetType]+encodeURIComponent(c.targetId) : "#/schedule"; }
function commentsBlock(type,id){
  const list=commentsFor(type,id); const tid=`c-${type}-${id}`.replace(/[^\w-]/g,"");
  return `${list.length?`<ul class="cmts">${list.map(c=>{ const ch=isChairId(c.by); return `<li class="cmt ${ch?"chair":""}"><span class="avatar av">${avatarIn(userById(c.by)||{name:nameOf(c.by)})}</span><div style="flex:1;min-width:0"><div class="h"><b>${esc(nameOf(c.by))}</b>${ch?'<span class="ctag">Chairman</span>':""}<span>${ago(c.at)}</span>${(isChair()&&c.by===me().id)?`<button class="linkb danger" onclick="delComment('${esc(c.id)}')">Delete</button>`:""}</div><div class="x">${esc(c.text)}</div></div></li>`; }).join("")}</ul>`:`<div class="empty" style="padding:8px 0;text-align:left">${isChair()?"No comments yet.":"No comments from the Chairman yet."}</div>`}
  ${isChair()?`<div class="cform"><textarea id="${tid}" rows="1" placeholder="Write a note for the team" aria-label="Comment" oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"></textarea><button class="btn btn-act" onclick="addComment('${type}','${esc(id)}','${tid}',this)">Send</button></div>`:""}`;
}
async function busy(btn, fn){ if(btn){ btn.disabled=true; btn._t=btn.innerHTML; btn.innerHTML='<span class="spin"></span>'; } try{ return await fn(); } finally { if(btn && document.body.contains(btn)){ btn.disabled=false; btn.innerHTML=btn._t; } } }
async function addComment(type,id,tid,btn){
  const ta=document.getElementById(tid); const text=(ta.value||"").trim(); if(!text){ toast("Write something first"); return; }
  const r=await busy(btn,()=>call("addComment",{targetType:type,targetId:id,text}));
  if(r){ ta.value=""; renderView(); toast("Comment posted"); }
}
async function delComment(id){ if(!confirm("Delete this comment?")) return; const r=await call("deleteComment",{id}); if(r){ renderView(); toast("Comment deleted"); } }

let sheetOpen=false;
function openSheet(title, body, actionLabel, onSave){
  $("#sheetBox").innerHTML=`<div class="grab"></div><div class="sheet-h"><h3>${esc(title)}</h3><button class="icon-b" style="width:38px;height:38px" onclick="closeSheet()" aria-label="Close">✕</button></div><div class="sheet-b">${body}</div>${actionLabel?`<div class="sheet-f"><button class="btn btn-ghost" onclick="closeSheet()">Cancel</button><button class="btn btn-gold" id="sheetSave">${esc(actionLabel)}</button></div>`:""}`;
  $("#sheet").classList.add("open"); document.body.style.overflow="hidden";
  if(onSave) $("#sheetSave").onclick=()=>busy($("#sheetSave"), onSave);
  if(!sheetOpen){ try{ history.pushState(Object.assign({},history.state,{sheet:true}),"",location.href); }catch(e){} sheetOpen=true; }
  setTimeout(()=>{ const f=$("#sheetBox .sheet-b input, #sheetBox .sheet-b select, #sheetBox .sheet-b textarea"); if(f && window.innerWidth>=700) f.focus(); },60);
}
function closeSheet(fromPop){
  if(!sheetOpen) return;
  sheetOpen=false; $("#sheet").classList.remove("open"); document.body.style.overflow="";
  if(!fromPop){ ignorePop=true; history.back(); }
}
$("#sheet").addEventListener("click", e=>{ if(e.target.hasAttribute("data-close")) closeSheet(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && sheetOpen) closeSheet(); });
const val = id => ((document.getElementById(id)||{}).value||"").trim();
const coOpts = (sel,grp) => (grp?`<option value="group"${sel==="group"?" selected":""}>ValueCrest Group</option>`:"")+COMPANIES.map(c=>`<option value="${c.key}"${sel===c.key?" selected":""}>${c.name}</option>`).join("");

function editProject(id, company){
  const p = id ? D().projects.find(x=>x.id===id) : {company:company||"carehub", status:"Not Started", priority:"Medium", progress:0};
  openSheet(id?"Edit project":"New project", `
    <div class="f"><label for="pT">Project name</label><input id="pT" value="${esc(p.title||"")}" placeholder="e.g. Final 2027 price list"></div>
    <div class="f"><label for="pC">Company</label><select id="pC">${coOpts(p.company)}</select></div>
    <div class="f"><label for="pR">Responsible</label><input id="pR" value="${esc(p.responsible||"")}" placeholder="e.g. Dr. Dalia Saeed"></div>
    <div class="frow"><div class="f"><label for="pSD">Start date</label><input type="date" id="pSD" value="${esc(p.startDate||"")}"></div><div class="f"><label for="pD">Deadline</label><input type="date" id="pD" value="${esc(p.deadline||"")}"></div></div>
    <div class="frow"><div class="f"><label for="pS">Status</label><select id="pS">${P_STATUS.map(s=>`<option${p.status===s?" selected":""}>${s}</option>`).join("")}</select></div><div class="f"><label for="pPr">Priority</label><select id="pPr">${PRIORITY.map(s=>`<option${p.priority===s?" selected":""}>${s}</option>`).join("")}</select></div></div>
    ${id?"":`<div class="f"><label for="pP">Current progress</label><div class="rng-v" id="pPV">${p.progress}%</div><input type="range" id="pP" min="0" max="100" step="5" value="${p.progress}" oninput="document.getElementById('pPV').textContent=this.value+'%'"></div>`}
    <div class="f"><label for="pDesc">Description</label><textarea id="pDesc" placeholder="Goal, scope or anything the Chairman should know">${esc(p.description||"")}</textarea></div>`,
    id?"Save changes":"Add project", async()=>{
      const data={id, title:val("pT"), company:val("pC"), responsible:val("pR"), startDate:val("pSD"), deadline:val("pD"), status:val("pS"), priority:val("pPr"), description:val("pDesc"), progress: id?undefined:Number(val("pP"))};
      if(!data.title){ toast("Add a project name", true); return; }
      const r=await call("saveProject",data);
      if(r){ closeSheet(); toast(id?"Project saved":"Project added"); if(!id && r.id) setTimeout(()=>go("#/project/"+r.id),50); else renderView(); }
    });
}
function logProgress(pid){
  const p=D().projects.find(x=>x.id===pid);
  openSheet("Log progress", `
    <div class="f"><label for="lgP">Where does it stand?</label><div class="rng-v" id="lgV">${p.progress}%</div><input type="range" id="lgP" min="0" max="100" step="5" value="${p.progress}" oninput="document.getElementById('lgV').textContent=this.value+'%';const s=document.getElementById('lgS');if(+this.value>0&&s.value==='Not Started')s.value='In Progress';"></div>
    <div class="frow"><div class="f"><label for="lgS">Status</label><select id="lgS">${P_STATUS.map(s=>`<option${p.status===s?" selected":""}>${s}</option>`).join("")}</select></div><div class="f"><label for="lgD">As of</label><input type="date" id="lgD" value="${todayStr()}" max="${todayStr()}"></div></div>
    <div class="f"><label for="lgN">What happened</label><textarea id="lgN" placeholder="e.g. Draft sent to finance for review"></textarea></div>`,
    "Save progress", async()=>{
      let status=val("lgS"); const progress=Number(val("lgP"));
      if(progress>=100 && status!=="Completed" && confirm("Progress is 100%. Mark the project as Completed?")) status="Completed";
      const r=await call("logProgress",{projectId:pid, progress, status, note:val("lgN"), date:val("lgD")});
      if(r){ closeSheet(); renderView(); toast("Progress saved"); }
    });
}
async function delProject(id){ if(!confirm("Delete this project with its history and comments? This can’t be undone.")) return; const p=D().projects.find(x=>x.id===id); const r=await call("deleteProject",{id}); if(r){ toast("Project deleted"); location.replace("#/company/"+(p?p.company:"carehub")); } }

function editAppt(id){
  const a = id ? D().appointments.find(x=>x.id===id) : {date:schedAnchor(), type:"Meeting"};
  openSheet(id?"Edit appointment":"New appointment", `
    <div class="f"><label for="aW">With</label><input id="aW" value="${esc(a.withWho||"")}" placeholder="e.g. Mina Samy"></div>
    <div class="frow"><div class="f"><label for="aD">Date</label><input type="date" id="aD" value="${esc(a.date||"")}"></div><div class="f"><label for="aTy">Type</label><select id="aTy">${[...new Set([...APPT_TYPES, a.type].filter(Boolean))].map(t=>`<option${a.type===t?" selected":""}>${esc(t)}</option>`).join("")}</select></div></div>
    <div class="frow"><div class="f"><label for="aT">Start</label><input type="time" id="aT" value="${esc(a.time||"")}"></div><div class="f"><label for="aE">End (optional)</label><input type="time" id="aE" value="${esc(a.endTime||"")}"></div></div>
    <div class="f"><label for="aA">Attending</label><input id="aA" value="${esc(a.attendance||"")}" placeholder="Names, separated by commas"></div>
    <div class="f"><label for="aL">Location</label><input id="aL" value="${esc(a.location||"")}" placeholder="ValueCrest office, Zoom…"></div>
    <div class="f"><label for="aC">Company (optional)</label><select id="aC"><option value="">—</option>${coOpts(a.company,true)}</select></div>
    <div class="f"><label for="aN">Note (optional)</label><textarea id="aN" placeholder="Agenda or anything to prepare">${esc(a.note||"")}</textarea></div>`,
    id?"Save changes":"Add appointment", async()=>{
      const data={id, withWho:val("aW"), date:val("aD"), type:val("aTy"), time:val("aT"), endTime:val("aE"), attendance:val("aA"), location:val("aL"), company:val("aC"), note:val("aN")};
      if(!data.withWho||!data.date||!data.time){ toast("Fill in who it’s with, the date and start time", true); return; }
      if(isFri(parseDay(data.date)) && !confirm("Friday is the weekend. Book it anyway?")) return;
      const r=await call("saveAppointment",data);
      if(r){ closeSheet(); S.anchor=data.date; renderView(); toast(id?"Appointment saved":"Appointment added"); }
    });
}
async function delAppt(id){ if(!confirm("Delete this appointment?")) return; const r=await call("deleteAppointment",{id}); if(r){ toast("Appointment deleted"); location.replace("#/schedule"); } }

function editInitiative(id){
  const i = id ? D().initiatives.find(x=>x.id===id) : {company:"group", priority:"Medium", status:"Proposed"};
  openSheet(id?"Edit initiative":"New initiative", `
    <div class="f"><label for="iT">Initiative</label><input id="iT" value="${esc(i.title||"")}" placeholder="What should happen?"></div>
    <div class="f"><label for="iD">Details</label><textarea id="iD" placeholder="Context, expected outcome, who to involve">${esc(i.description||"")}</textarea></div>
    <div class="frow"><div class="f"><label for="iC">Company</label><select id="iC">${coOpts(i.company,true)}</select></div><div class="f"><label for="iP">Priority</label><select id="iP">${PRIORITY.map(s=>`<option${i.priority===s?" selected":""}>${s}</option>`).join("")}</select></div></div>
    <div class="frow"><div class="f"><label for="iO">Follow-up</label><input id="iO" value="${esc(i.owner||"")}" placeholder="Who follows it up"></div><div class="f"><label for="iTD">Target date</label><input type="date" id="iTD" value="${esc(i.targetDate||"")}"></div></div>
    <div class="f"><label for="iS">Status</label><select id="iS">${I_STATUS.map(s=>`<option${i.status===s?" selected":""}>${s}</option>`).join("")}</select></div>`,
    id?"Save changes":"Add initiative", async()=>{
      const data={id, title:val("iT"), description:val("iD"), company:val("iC"), priority:val("iP"), owner:val("iO"), targetDate:val("iTD"), status:val("iS")};
      if(!data.title){ toast("Add the initiative title", true); return; }
      const r=await call("saveInitiative",data);
      if(r){ closeSheet(); renderView(); toast(id?"Initiative saved":"Initiative added"); }
    });
}
async function chairSet(id,btn){ const r=await busy(btn,()=>call("chairSetProject",{id,status:val("chSt"),priority:val("chPr")})); if(r){ renderView(); toast("Saved"); } }
function convertIni(id){
  const i=D().initiatives.find(x=>x.id===id); if(!i) return;
  openSheet("Turn into a project", `
    <p style="margin-top:0"><b>${esc(i.title)}</b> becomes a project you follow up. The Chairman’s comments move with it.</p>
    <div class="f"><label for="cvC">Company</label><select id="cvC">${i.company==="group"?`<option value="">Choose a company</option>`:""}${coOpts(i.company==="group"?"":i.company)}</select></div>
    <div class="f"><label for="cvR">Responsible</label><input id="cvR" value="${esc(i.owner||me().name||"")}"></div>
    <div class="f"><label for="cvD">Deadline</label><input type="date" id="cvD" value="${esc(i.targetDate||"")}"></div>`,
    "Create project", async()=>{
      if(!val("cvC")){ toast("Choose a company", true); return; }
      const r=await call("convertInitiative",{id, company:val("cvC"), responsible:val("cvR"), deadline:val("cvD")});
      if(r){ closeSheet(); toast("Project created from the initiative"); setTimeout(()=>{ location.replace("#/project/"+r.id); },60); }
    });
}
async function setIniStatus(id,btn){ const r=await busy(btn,()=>call("setInitiativeStatus",{id,status:val("iniSt")})); if(r){ renderView(); toast("Status saved"); } }
async function delInitiative(id){ if(!confirm("Delete this initiative?")) return; const r=await call("deleteInitiative",{id}); if(r){ toast("Initiative deleted"); location.replace("#/initiatives"); } }

function changePassword(){
  openSheet("Change password", pwFields(), "Change password", async()=>{
    const r=await submitPw(); if(r){ closeSheet(); toast("Password changed"); }
  });
}
const pwFields = () => `
  <div class="f"><label for="op">Current password</label><input id="op" type="password" autocomplete="current-password"></div>
  <div class="f"><label for="np">New password</label><input id="np" type="password" autocomplete="new-password" placeholder="At least 6 characters"></div>
  <div class="f"><label for="np2">Repeat new password</label><input id="np2" type="password" autocomplete="new-password"></div>`;
async function submitPw(){
  const o=$("#op").value, n=$("#np").value, n2=$("#np2").value;
  if(n.length<6){ toast("Use at least 6 characters for the new password", true); return null; }
  if(n!==n2){ toast("The new passwords don’t match", true); return null; }
  return call("changePassword",{oldPassword:o,newPassword:n});
}
function renderForcedPassword(){
  $("#root").innerHTML=`<div class="login"><img class="logo" src="${LOGO_FULL}" alt="ValueCrest" style="width:min(240px,60vw)">
    <form id="pf" novalidate><h1>Choose your password</h1><p class="sub">Welcome, ${esc(me().name||"")}. Replace the temporary password with one only you know.</p>
    <div class="lf"><label for="op">Temporary password</label><input id="op" type="password" autocomplete="current-password"></div>
    <div class="lf"><label for="np">New password</label><input id="np" type="password" autocomplete="new-password" placeholder="At least 8 characters"></div>
    <div class="lf"><label for="np2">Repeat new password</label><input id="np2" type="password" autocomplete="new-password"></div>
    <button class="btn btn-gold btn-block" id="pb" type="submit">Save and continue</button>
    <button class="btn btn-block" type="button" style="background:none;color:var(--on-navy-muted)" onclick="signOut()">Sign out</button></form></div>`;
  $("#pf").addEventListener("submit", async e=>{ e.preventDefault(); const r=await busy($("#pb"),submitPw); if(r){ if(!location.hash||location.hash==="#") location.replace("#/home"); renderApp(); toast("Password saved. Welcome!"); } });
}

function editUser(id){
  const u = id ? D().users.find(x=>x.id===id) : {role:"pmo", active:true, isAdmin:false};
  openSheet(id?"Edit user":"New user", `
    <div class="f"><label for="uN">Full name</label><input id="uN" value="${esc(u.name||"")}" placeholder="e.g. Mr. Ahmed Hassan"></div>
    <div class="f"><label for="uT">Job title</label><input id="uT" value="${esc(u.title||"")}" placeholder="e.g. PMO"></div>
    <div class="frow"><div class="f"><label for="uU">Username</label><input id="uU" value="${esc(u.username||"")}" autocapitalize="none" spellcheck="false"></div><div class="f"><label for="uR">Role</label><select id="uR">${Object.entries(ROLE_NAME).map(([k,l])=>`<option value="${k}"${u.role===k?" selected":""}>${l}</option>`).join("")}</select></div></div>
    <label class="chk" style="color:var(--text);margin:6px 0 12px"><input type="checkbox" id="uA" ${u.active?"checked":""}> Active (can sign in)</label>
    <label class="chk" style="color:var(--text);margin-bottom:12px"><input type="checkbox" id="uAd" ${u.isAdmin?"checked":""}> Admin (manages users)</label>
    ${id?`<button class="btn btn-ghost btn-block" type="button" onclick="resetPw('${esc(id)}',this)">Reset password</button>`:`<div class="f"><label for="uP">Password (optional)</label><input id="uP" placeholder="Leave empty to create one"></div><div class="note">You can see and change every password later in the Users sheet.</div>`}`,
    id?"Save changes":"Add user", async()=>{
      const data={id, name:val("uN"), title:val("uT"), username:val("uU"), role:val("uR"), active:$("#uA").checked, isAdmin:$("#uAd").checked, password:val("uP")};
      const r=await call("saveUser",data);
      if(r){ if(r.tempPassword) showTemp(data.name, data.username, r.tempPassword); else { closeSheet(); toast("User saved"); } renderView(); }
    });
}
async function resetPw(id,btn){
  const u=D().users.find(x=>x.id===id);
  if(!confirm("Reset the password for "+u.name+"? They will be signed out on all devices.")) return;
  const r=await busy(btn,()=>call("resetPassword",{id})); if(r) showTemp(u.name,u.username,r.tempPassword);
}
function showTemp(name,username,pw){
  openSheet("Password", `<p style="margin-top:0">Send this privately to <b>${esc(name)}</b>. It’s also in the Users sheet, where you can change it.</p><div class="note">Username: <b>${esc(username)}</b></div><div class="code">${esc(pw)}</div><button class="btn btn-ghost btn-block" onclick="navigator.clipboard&&navigator.clipboard.writeText('${esc(pw)}').then(()=>toast('Copied'))">Copy password</button>`, null, null);
}
async function signOut(){ if(!confirm("Sign out of this device?")) return; await call("logout",{}, {quiet:true}); signOutLocal(); }

/* ---------- boot ---------- */
let _narrow = window.innerWidth<600 ? 0 : window.innerWidth>1100 ? 2 : 1;
window.addEventListener("resize", ()=>{ const n=window.innerWidth<600 ? 0 : window.innerWidth>1100 ? 2 : 1; if(n!==_narrow){ _narrow=n; if(S.token && $("#view")) renderView(); } });
window.addEventListener("online", ()=>{ S.online=true; sync(true); });
window.addEventListener("offline", ()=>{ S.online=false; renderStatus(); });
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible" && S.token && (!S.lastSync || Date.now()-S.lastSync>30000)) sync(true); });
setInterval(()=>{ if(document.visibilityState==="visible" && S.token && !sheetOpen) sync(true); }, 60000);

(async function boot(){
  if(!location.hash){ const last=store.get("vc_route"); if(last && last.indexOf("#/")===0 && S.token) history.replaceState(null,"",last); }
  if(!S.token){ renderLogin(); return; }
  if(S.data && S.user && !S.user.mustChange){ renderApp(); sync(true); return; }
  if(S.user && S.user.mustChange){ renderApp(); return; }
  const r=await call("bootstrap",{}, {quiet:true});
  if(!S.token) return;
  if(r){ renderApp(); }
  else if(S.token){ if(S.user && S.user.mustChange) renderApp(); else renderLogin({error:"Couldn’t reach the server. Check your connection and try again."}); }
})();
</script>
